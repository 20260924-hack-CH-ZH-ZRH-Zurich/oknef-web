name: oknef-web
services:
  web:
    image: oknef-web:${IMAGE_TAG:-dev}
    build: .
    env_file: .env
    ports: ["${WEB_PORT:-3000}:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
