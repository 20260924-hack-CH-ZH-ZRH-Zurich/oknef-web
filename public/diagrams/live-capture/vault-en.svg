<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Authenticator-assisted local vault unlocking</title><desc id="desc">Camera evidence never unlocks the vault. This is not face recognition by Oknef, identity proof, an independent audit or compromised-device protection.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bfee76"/></marker></defs>
<rect width="1400" height="900" rx="28" fill="#16231b"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="52" fill="#bfee76" font-size="16" font-weight="700">OKNEF  /  EN  /  2026-09-25</text>

<text x="52" y="108" fill="#f3f8f1" font-size="34" font-weight="700">Authenticator-assisted local vault unlocking</text>

<text x="52" y="147" fill="#bdcbbf" font-size="20" font-weight="400">Optional WebAuthn PRF wrapping · requires a compatible authenticator and HTTPS origin</text>

<path d="M440 282H495" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M898 282H952" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1162 385V408" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M953 518H912" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M496 518H454" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<g data-card="1"><rect x="52" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="221" fill="#bfee76" font-size="16" font-weight="700">01</text>

<text x="74" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Verify on the authenticator</text>

<text x="74" y="286" fill="#d5e1da" font-size="18" font-weight="400">The browser requires user</text>
<text x="74" y="310" fill="#d5e1da" font-size="18" font-weight="400">verification: a device PIN or an</text>
<text x="74" y="334" fill="#d5e1da" font-size="18" font-weight="400">authenticator-supported biometric.</text>

</g>
<g data-card="2"><rect x="510" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="221" fill="#bfee76" font-size="16" font-weight="700">02</text>

<text x="532" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Evaluate WebAuthn PRF</text>

<text x="532" y="286" fill="#d5e1da" font-size="18" font-weight="400">The selected credential produces a</text>
<text x="532" y="310" fill="#d5e1da" font-size="18" font-weight="400">32-byte result. Missing PRF support</text>
<text x="532" y="334" fill="#d5e1da" font-size="18" font-weight="400">stops enrollment.</text>

</g>
<g data-card="3"><rect x="968" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="221" fill="#bfee76" font-size="16" font-weight="700">03</text>

<text x="990" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Derive a wrapping key</text>

<text x="990" y="286" fill="#d5e1da" font-size="18" font-weight="400">HKDF-SHA-256 combines the PRF result,</text>
<text x="990" y="310" fill="#d5e1da" font-size="18" font-weight="400">a random salt and a dedicated</text>
<text x="990" y="334" fill="#d5e1da" font-size="18" font-weight="400">application context.</text>

</g>
<g data-card="4"><rect x="968" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="454" fill="#bfee76" font-size="16" font-weight="700">04</text>

<text x="990" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Wrap with AES-256-GCM</text>

<text x="990" y="519" fill="#d5e1da" font-size="18" font-weight="400">Encrypt the vault recovery key.</text>
<text x="990" y="543" fill="#d5e1da" font-size="18" font-weight="400">Associated data binds the local</text>
<text x="990" y="567" fill="#d5e1da" font-size="18" font-weight="400">record to its owner and origin.</text>

</g>
<g data-card="5"><rect x="510" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="454" fill="#bfee76" font-size="16" font-weight="700">05</text>

<text x="532" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Keep the sealed record locally</text>

<text x="532" y="519" fill="#d5e1da" font-size="18" font-weight="400">Store credential ID, salt, IV and</text>
<text x="532" y="543" fill="#d5e1da" font-size="18" font-weight="400">ciphertext in this browser. Do not</text>
<text x="532" y="567" fill="#d5e1da" font-size="18" font-weight="400">store a plaintext recovery key.</text>

</g>
<g data-card="6"><rect x="52" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="454" fill="#bfee76" font-size="16" font-weight="700">06</text>

<text x="74" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Unlock with the credential</text>

<text x="74" y="519" fill="#d5e1da" font-size="18" font-weight="400">Repeat verification and PRF, decrypt</text>
<text x="74" y="543" fill="#d5e1da" font-size="18" font-weight="400">locally and import the vault key into</text>
<text x="74" y="567" fill="#d5e1da" font-size="18" font-weight="400">browser memory.</text>

</g>
<rect x="52" y="650" width="1296" height="112" rx="18" fill="#31452b"/>
<text x="75" y="684" fill="#d8f0b7" font-size="23" font-weight="700">Separate recovery · the owner keeps a backup key</text>

<text x="75" y="718" fill="#e5eedf" font-size="20" font-weight="400">Vault entries use AES-256-GCM with the vault key. Losing this browser or authenticator may require the separately saved recovery</text>
<text x="75" y="745" fill="#e5eedf" font-size="20" font-weight="400">key.</text>

<text x="52" y="811" fill="#e8ce96" font-size="20" font-weight="400">Camera evidence never unlocks the vault. This is not face recognition by Oknef, identity proof, an independent audit or</text>
<text x="52" y="840" fill="#e8ce96" font-size="20" font-weight="400">compromised-device protection.</text>

</g></svg>
