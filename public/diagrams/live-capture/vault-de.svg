<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Lokaler Tresorzugriff mit Authentifikator</title><desc id="desc">Kamerabelege entsperren keinen Tresor. Keine Oknef-Gesichtserkennung, Identitätsprüfung, unabhängige Prüfung oder Absicherung kompromittierter Geräte.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bfee76"/></marker></defs>
<rect width="1400" height="900" rx="28" fill="#16231b"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="52" fill="#bfee76" font-size="16" font-weight="700">OKNEF  /  DE  /  2026-09-25</text>

<text x="52" y="108" fill="#f3f8f1" font-size="34" font-weight="700">Lokaler Tresorzugriff mit Authentifikator</text>

<text x="52" y="147" fill="#bdcbbf" font-size="20" font-weight="400">Optionale Schlüsselhülle mit WebAuthn PRF · kompatibler Authentifikator und HTTPS erforderlich</text>

<path d="M440 282H495" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M898 282H952" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1162 385V408" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M953 518H912" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M496 518H454" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<g data-card="1"><rect x="52" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="221" fill="#bfee76" font-size="16" font-weight="700">01</text>

<text x="74" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Am Authentifikator bestätigen</text>

<text x="74" y="286" fill="#d5e1da" font-size="18" font-weight="400">Der Browser verlangt Nutzerprüfung:</text>
<text x="74" y="310" fill="#d5e1da" font-size="18" font-weight="400">Geräte-PIN oder vom Authentifikator</text>
<text x="74" y="334" fill="#d5e1da" font-size="18" font-weight="400">unterstützte Biometrie.</text>

</g>
<g data-card="2"><rect x="510" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="221" fill="#bfee76" font-size="16" font-weight="700">02</text>

<text x="532" y="255" fill="#f3f8f1" font-size="22" font-weight="700">WebAuthn PRF auswerten</text>

<text x="532" y="286" fill="#d5e1da" font-size="18" font-weight="400">Die gewählte Zugangsdaten-ID liefert</text>
<text x="532" y="310" fill="#d5e1da" font-size="18" font-weight="400">32 Bytes. Ohne PRF-Unterstützung</text>
<text x="532" y="334" fill="#d5e1da" font-size="18" font-weight="400">endet die Einrichtung.</text>

</g>
<g data-card="3"><rect x="968" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="221" fill="#bfee76" font-size="16" font-weight="700">03</text>

<text x="990" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Hüllenschlüssel ableiten</text>

<text x="990" y="286" fill="#d5e1da" font-size="18" font-weight="400">HKDF-SHA-256 kombiniert PRF,</text>
<text x="990" y="310" fill="#d5e1da" font-size="18" font-weight="400">zufälliges Salt und einen eigenen</text>
<text x="990" y="334" fill="#d5e1da" font-size="18" font-weight="400">Anwendungskontext.</text>

</g>
<g data-card="4"><rect x="968" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="454" fill="#bfee76" font-size="16" font-weight="700">04</text>

<text x="990" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Mit AES-256-GCM umhüllen</text>

<text x="990" y="519" fill="#d5e1da" font-size="18" font-weight="400">Den Wiederherstellungsschlüssel</text>
<text x="990" y="543" fill="#d5e1da" font-size="18" font-weight="400">verschlüsseln. Zusatzdaten binden den</text>
<text x="990" y="567" fill="#d5e1da" font-size="18" font-weight="400">Datensatz an Inhaber und Ursprung.</text>

</g>
<g data-card="5"><rect x="510" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="454" fill="#bfee76" font-size="16" font-weight="700">05</text>

<text x="532" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Verschlüsselt lokal speichern</text>

<text x="532" y="519" fill="#d5e1da" font-size="18" font-weight="400">Zugangsdaten-ID, Salt, IV und</text>
<text x="532" y="543" fill="#d5e1da" font-size="18" font-weight="400">Chiffrat bleiben im Browser. Kein</text>
<text x="532" y="567" fill="#d5e1da" font-size="18" font-weight="400">Wiederherstellungsschlüssel im</text>
<text x="532" y="591" fill="#d5e1da" font-size="18" font-weight="400">Klartext.</text>

</g>
<g data-card="6"><rect x="52" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="454" fill="#bfee76" font-size="16" font-weight="700">06</text>

<text x="74" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Mit Zugangsdaten entsperren</text>

<text x="74" y="519" fill="#d5e1da" font-size="18" font-weight="400">Prüfung und PRF wiederholen, lokal</text>
<text x="74" y="543" fill="#d5e1da" font-size="18" font-weight="400">entschlüsseln und den Tresorschlüssel</text>
<text x="74" y="567" fill="#d5e1da" font-size="18" font-weight="400">in den Browserspeicher importieren.</text>

</g>
<rect x="52" y="650" width="1296" height="112" rx="18" fill="#31452b"/>
<text x="75" y="684" fill="#d8f0b7" font-size="23" font-weight="700">Separate Wiederherstellung · Schlüsselkopie beim Inhaber</text>

<text x="75" y="718" fill="#e5eedf" font-size="20" font-weight="400">Tresoreinträge nutzen AES-256-GCM mit dem Tresorschlüssel. Bei Verlust von Browser oder Authentifikator kann die separate</text>
<text x="75" y="745" fill="#e5eedf" font-size="20" font-weight="400">Schlüsselkopie nötig sein.</text>

<text x="52" y="811" fill="#e8ce96" font-size="20" font-weight="400">Kamerabelege entsperren keinen Tresor. Keine Oknef-Gesichtserkennung, Identitätsprüfung, unabhängige Prüfung oder Absicherung</text>
<text x="52" y="840" fill="#e8ce96" font-size="20" font-weight="400">kompromittierter Geräte.</text>

</g></svg>
