<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">De la evidencia seleccionada a un activo vinculado</title><desc id="desc">El resumen prueba la recepción de esos bytes. No prueba autenticidad, identidad, presencia de una persona ni ausencia de deepfakes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bfee76"/></marker></defs>
<rect width="1400" height="900" rx="28" fill="#16231b"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="52" fill="#bfee76" font-size="16" font-weight="700">OKNEF  /  ES  /  2026-09-25</text>

<text x="52" y="108" fill="#f3f8f1" font-size="34" font-weight="700">De la evidencia seleccionada a un activo vinculado</text>

<text x="52" y="147" fill="#bdcbbf" font-size="20" font-weight="400">Una acción explícita en cada paso · documento, imagen, audio, vídeo o QR</text>

<path d="M440 282H495" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M898 282H952" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1162 385V408" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M953 518H912" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M496 518H454" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<g data-card="1"><rect x="52" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="221" fill="#bfee76" font-size="16" font-weight="700">01</text>

<text x="74" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Seleccionar o capturar</text>

<text x="74" y="286" fill="#d5e1da" font-size="18" font-weight="400">Usa un archivo o autoriza la cámara /</text>
<text x="74" y="310" fill="#d5e1da" font-size="18" font-weight="400">el micrófono. Revisa el contenido</text>
<text x="74" y="334" fill="#d5e1da" font-size="18" font-weight="400">seleccionado.</text>

</g>
<g data-card="2"><rect x="510" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="221" fill="#bfee76" font-size="16" font-weight="700">02</text>

<text x="532" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Decidir el envío</text>

<text x="532" y="286" fill="#d5e1da" font-size="18" font-weight="400">El consentimiento envía la evidencia</text>
<text x="532" y="310" fill="#d5e1da" font-size="18" font-weight="400">al espacio de trabajo. El QR se</text>
<text x="532" y="334" fill="#d5e1da" font-size="18" font-weight="400">decodifica localmente.</text>

</g>
<g data-card="3"><rect x="968" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="221" fill="#bfee76" font-size="16" font-weight="700">03</text>

<text x="990" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Recibir los bytes</text>

<text x="990" y="286" fill="#d5e1da" font-size="18" font-weight="400">El servidor calcula SHA-256 y el</text>
<text x="990" y="310" fill="#d5e1da" font-size="18" font-weight="400">tamaño del archivo recibido. Es un</text>
<text x="990" y="334" fill="#d5e1da" font-size="18" font-weight="400">recibo de bytes.</text>

</g>
<g data-card="4"><rect x="968" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="454" fill="#bfee76" font-size="16" font-weight="700">04</text>

<text x="990" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Revisar con el modelo</text>

<text x="990" y="519" fill="#d5e1da" font-size="18" font-weight="400">AI Core solicita OCR u observaciones</text>
<text x="990" y="543" fill="#d5e1da" font-size="18" font-weight="400">acotadas. Los resultados pueden</text>
<text x="990" y="567" fill="#d5e1da" font-size="18" font-weight="400">contener errores u omisiones.</text>

</g>
<g data-card="5"><rect x="510" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="454" fill="#bfee76" font-size="16" font-weight="700">05</text>

<text x="532" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Guardar la sesión</text>

<text x="532" y="519" fill="#d5e1da" font-size="18" font-weight="400">Conserva método, resumen,</text>
<text x="532" y="543" fill="#d5e1da" font-size="18" font-weight="400">observaciones y límites con</text>
<text x="532" y="567" fill="#d5e1da" font-size="18" font-weight="400">autorización del espacio de trabajo.</text>

</g>
<g data-card="6"><rect x="52" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="454" fill="#bfee76" font-size="16" font-weight="700">06</text>

<text x="74" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Confirmar el activo</text>

<text x="74" y="519" fill="#d5e1da" font-size="18" font-weight="400">Revisa los campos extraídos antes de</text>
<text x="74" y="543" fill="#d5e1da" font-size="18" font-weight="400">guardar. El activo enlaza con su</text>
<text x="74" y="567" fill="#d5e1da" font-size="18" font-weight="400">sesión de origen.</text>

</g>
<rect x="52" y="650" width="1296" height="112" rx="18" fill="#31452b"/>
<text x="75" y="684" fill="#d8f0b7" font-size="23" font-weight="700">El original y el registro se guardan por separado</text>

<text x="75" y="718" fill="#e5eedf" font-size="20" font-weight="400">Al guardar, el navegador puede conservar el original cifrado con AES-256-GCM. El servidor guarda el registro de la sesión, no el</text>
<text x="75" y="745" fill="#e5eedf" font-size="20" font-weight="400">archivo original.</text>

<text x="52" y="811" fill="#e8ce96" font-size="20" font-weight="400">El resumen prueba la recepción de esos bytes. No prueba autenticidad, identidad, presencia de una persona ni ausencia de</text>
<text x="52" y="840" fill="#e8ce96" font-size="20" font-weight="400">deepfakes.</text>

</g></svg>
