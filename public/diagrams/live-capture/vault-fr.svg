<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Déverrouillage local avec un authentificateur</title><desc id="desc">La caméra ne déverrouille jamais le coffre. Ni reconnaissance faciale Oknef, ni preuve d’identité, audit indépendant ou protection d’un appareil compromis.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bfee76"/></marker></defs>
<rect width="1400" height="900" rx="28" fill="#16231b"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="52" y="52" fill="#bfee76" font-size="16" font-weight="700">OKNEF  /  FR  /  2026-09-25</text>

<text x="52" y="108" fill="#f3f8f1" font-size="34" font-weight="700">Déverrouillage local avec un authentificateur</text>

<text x="52" y="147" fill="#bdcbbf" font-size="20" font-weight="400">Enveloppe facultative avec WebAuthn PRF · authentificateur compatible et origine HTTPS requis</text>

<path d="M440 282H495" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M898 282H952" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M1162 385V408" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M953 518H912" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M496 518H454" fill="none" stroke="#bfee76" stroke-width="3" marker-end="url(#arrow)"/>
<g data-card="1"><rect x="52" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="221" fill="#bfee76" font-size="16" font-weight="700">01</text>

<text x="74" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Vérifier sur</text>
<text x="74" y="282" fill="#f3f8f1" font-size="22" font-weight="700">l’authentificateur</text>

<text x="74" y="313" fill="#d5e1da" font-size="18" font-weight="400">Le navigateur exige une vérification</text>
<text x="74" y="337" fill="#d5e1da" font-size="18" font-weight="400">: code PIN ou biométrie prise en</text>
<text x="74" y="361" fill="#d5e1da" font-size="18" font-weight="400">charge par l’authentificateur.</text>

</g>
<g data-card="2"><rect x="510" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="221" fill="#bfee76" font-size="16" font-weight="700">02</text>

<text x="532" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Évaluer WebAuthn PRF</text>

<text x="532" y="286" fill="#d5e1da" font-size="18" font-weight="400">L’identifiant choisi produit 32</text>
<text x="532" y="310" fill="#d5e1da" font-size="18" font-weight="400">octets. Sans prise en charge de PRF,</text>
<text x="532" y="334" fill="#d5e1da" font-size="18" font-weight="400">la configuration s’arrête.</text>

</g>
<g data-card="3"><rect x="968" y="190" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="221" fill="#bfee76" font-size="16" font-weight="700">03</text>

<text x="990" y="255" fill="#f3f8f1" font-size="22" font-weight="700">Dériver la clé d’enveloppe</text>

<text x="990" y="286" fill="#d5e1da" font-size="18" font-weight="400">HKDF-SHA-256 combine PRF, sel</text>
<text x="990" y="310" fill="#d5e1da" font-size="18" font-weight="400">aléatoire et contexte dédié à</text>
<text x="990" y="334" fill="#d5e1da" font-size="18" font-weight="400">l’application.</text>

</g>
<g data-card="4"><rect x="968" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="990" y="454" fill="#bfee76" font-size="16" font-weight="700">04</text>

<text x="990" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Envelopper avec AES-256-GCM</text>

<text x="990" y="519" fill="#d5e1da" font-size="18" font-weight="400">Chiffrer la clé de récupération. Les</text>
<text x="990" y="543" fill="#d5e1da" font-size="18" font-weight="400">données associées lient le dossier au</text>
<text x="990" y="567" fill="#d5e1da" font-size="18" font-weight="400">propriétaire et à l’origine.</text>

</g>
<g data-card="5"><rect x="510" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="532" y="454" fill="#bfee76" font-size="16" font-weight="700">05</text>

<text x="532" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Garder le dossier chiffré</text>

<text x="532" y="519" fill="#d5e1da" font-size="18" font-weight="400">Identifiant, sel, IV et texte chiffré</text>
<text x="532" y="543" fill="#d5e1da" font-size="18" font-weight="400">restent dans ce navigateur, sans clé</text>
<text x="532" y="567" fill="#d5e1da" font-size="18" font-weight="400">de récupération en clair.</text>

</g>
<g data-card="6"><rect x="52" y="423" width="380" height="193" rx="18" fill="#24392c" stroke="#55745a"/>
<text x="74" y="454" fill="#bfee76" font-size="16" font-weight="700">06</text>

<text x="74" y="488" fill="#f3f8f1" font-size="22" font-weight="700">Déverrouiller avec la clé</text>

<text x="74" y="519" fill="#d5e1da" font-size="18" font-weight="400">Répéter vérification et PRF,</text>
<text x="74" y="543" fill="#d5e1da" font-size="18" font-weight="400">déchiffrer localement et importer la</text>
<text x="74" y="567" fill="#d5e1da" font-size="18" font-weight="400">clé du coffre en mémoire du</text>
<text x="74" y="591" fill="#d5e1da" font-size="18" font-weight="400">navigateur.</text>

</g>
<rect x="52" y="650" width="1296" height="112" rx="18" fill="#31452b"/>
<text x="75" y="684" fill="#d8f0b7" font-size="23" font-weight="700">Récupération séparée · le titulaire conserve une copie de clé</text>

<text x="75" y="718" fill="#e5eedf" font-size="20" font-weight="400">Les entrées utilisent AES-256-GCM avec la clé du coffre. La perte du navigateur ou de l’authentificateur peut exiger la clé de</text>
<text x="75" y="745" fill="#e5eedf" font-size="20" font-weight="400">récupération conservée à part.</text>

<text x="52" y="811" fill="#e8ce96" font-size="20" font-weight="400">La caméra ne déverrouille jamais le coffre. Ni reconnaissance faciale Oknef, ni preuve d’identité, audit indépendant ou</text>
<text x="52" y="840" fill="#e8ce96" font-size="20" font-weight="400">protection d’un appareil compromis.</text>

</g></svg>
