<text x="86" y="212" fill="#527a6c" font-size="15" font-weight="700">01</text>
<text x="86" y="244" fill="#183e37" font-size="23" font-weight="700">Ouvrir le chat ou une mini-app</text>
<text x="86" y="277" fill="#183e37" font-size="19" font-weight="400">Choisir la tâche et l’espace de travail</text>
<rect x="744" y="178" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="212" fill="#527a6c" font-size="15" font-weight="700">02</text>
<text x="768" y="244" fill="#183e37" font-size="23" font-weight="700">Capturer avec autorisation</text>
<text x="768" y="277" fill="#183e37" font-size="19" font-weight="400">QR, audio, image ou document</text>
