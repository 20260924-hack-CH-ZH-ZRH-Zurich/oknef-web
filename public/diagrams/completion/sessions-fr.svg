<text x="86" y="396" fill="#527a6c" font-size="15" font-weight="700">03</text>
<text x="86" y="428" fill="#183e37" font-size="23" font-weight="700">Vérifier avant l’envoi</text>
<text x="86" y="461" fill="#183e37" font-size="19" font-weight="400">Partager uniquement les éléments choisis</text>
<rect x="744" y="362" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="396" fill="#527a6c" font-size="15" font-weight="700">04</text>
<text x="768" y="428" fill="#183e37" font-size="23" font-weight="700">Enregistrer la session</text>
<text x="768" y="461" fill="#183e37" font-size="19" font-weight="400">Conserver méthode, date et limites</text>
