<rect width="1400" height="760" rx="28" fill="#f4f7f2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="62" y="67" fill="#527a6c" font-size="17" font-weight="700">OKNEF  /  ES</text>
<text x="62" y="119" fill="#183e37" font-size="34" font-weight="700">Una sesión, evidencias conectadas</text>
<path d="M 612 239 L 744 239" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1020 306 L 340 362" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 612 424 L 744 424" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1020 490 L 680 546" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="62" y="178" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="86" y="212" fill="#527a6c" font-size="15" font-weight="700">01</text>
<text x="86" y="244" fill="#183e37" font-size="23" font-weight="700">Abrir chat o una miniaplicación</text>
<text x="86" y="277" fill="#183e37" font-size="19" font-weight="400">Elegir tarea y espacio de trabajo</text>
<rect x="744" y="178" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="212" fill="#527a6c" font-size="15" font-weight="700">02</text>
<text x="768" y="244" fill="#183e37" font-size="23" font-weight="700">Capturar con permiso</text>
<text x="768" y="277" fill="#183e37" font-size="19" font-weight="400">QR, audio, imagen o documento</text>
<rect x="62" y="362" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="86" y="396" fill="#527a6c" font-size="15" font-weight="700">03</text>
<text x="86" y="428" fill="#183e37" font-size="23" font-weight="700">Revisar antes de enviar</text>
<text x="86" y="461" fill="#183e37" font-size="19" font-weight="400">Solo se comparte lo seleccionado</text>
<rect x="744" y="362" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="396" fill="#527a6c" font-size="15" font-weight="700">04</text>
<text x="768" y="428" fill="#183e37" font-size="23" font-weight="700">Guardar la sesión</text>
<text x="768" y="461" fill="#183e37" font-size="19" font-weight="400">Conservar método, fecha y límites</text>
<rect x="402" y="546" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="426" y="580" fill="#527a6c" font-size="15" font-weight="700">05</text>
<text x="426" y="612" fill="#183e37" font-size="23" font-weight="700">Volver y hacer preguntas</text>
<text x="426" y="645" fill="#183e37" font-size="19" font-weight="400">Vincular evidencia con activos y acciones</text>
<text x="62" y="707" fill="#42564e" font-size="19" font-weight="400">Una sesión registra lo analizado. No demuestra identidad ni autenticidad.</text>
