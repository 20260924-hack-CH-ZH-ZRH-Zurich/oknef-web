<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">Una sesión, evidencias conectadas</title><desc id="desc">Una sesión registra lo analizado. No demuestra identidad ni autenticidad.</desc>
