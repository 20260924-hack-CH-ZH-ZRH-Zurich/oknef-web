<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc" xml:lang="es">
<title id="title">Acceso por voz y límite de confianza</title><desc id="desc">La transcripción y la detección de actividad de voz no autentican al hablante.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527a6c"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="#f4f7f2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="62" y="67" fill="#527a6c" font-size="17" font-weight="700">OKNEF  /  ES</text>
<text x="62" y="119" fill="#183e37" font-size="34" font-weight="700">Acceso por voz y límite de confianza</text>
<path d="M 612 239 L 744 239" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 850 306 L 500 362" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1020 306 L 1020 362" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 338 490 L 402 590" stroke="#527a6c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="62" y="178" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="86" y="212" fill="#527a6c" font-size="15" font-weight="700">01</text>
<text x="86" y="244" fill="#183e37" font-size="23" font-weight="700">Entrar al espacio de trabajo</text>
<text x="86" y="277" fill="#183e37" font-size="19" font-weight="400">Establecer acceso a cuenta y organización</text>
<rect x="744" y="178" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="212" fill="#527a6c" font-size="15" font-weight="700">02</text>
<text x="768" y="244" fill="#183e37" font-size="23" font-weight="700">Elegir la política de voz</text>
<text x="768" y="277" fill="#183e37" font-size="19" font-weight="400">Conversación o solo voz de confianza</text>
<rect x="62" y="362" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="86" y="396" fill="#527a6c" font-size="15" font-weight="700">03</text>
<text x="86" y="428" fill="#183e37" font-size="23" font-weight="700">Conversación normal</text>
<text x="86" y="461" fill="#183e37" font-size="19" font-weight="400">Permiso, silencio y detección de voz</text>
<rect x="744" y="362" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="768" y="396" fill="#527a6c" font-size="15" font-weight="700">04</text>
<text x="768" y="428" fill="#183e37" font-size="23" font-weight="700">Solo voz de confianza</text>
<text x="768" y="461" fill="#183e37" font-size="19" font-weight="400">Bloquear si no hay verificador configurado</text>
<rect x="402" y="546" width="550" height="126" rx="17" fill="white" stroke="#c5d4cb" stroke-width="2"/>
<text x="426" y="580" fill="#527a6c" font-size="15" font-weight="700">05</text>
<text x="426" y="612" fill="#183e37" font-size="23" font-weight="700">Confirmar acciones sensibles</text>
<text x="426" y="645" fill="#183e37" font-size="19" font-weight="400">La voz no aprueba ni libera claves</text>
<text x="62" y="707" fill="#42564e" font-size="19" font-weight="400">La transcripción y la detección de actividad de voz no autentican al hablante.</text>
</g></svg>
