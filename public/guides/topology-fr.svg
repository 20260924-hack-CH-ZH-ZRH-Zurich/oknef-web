<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Une carte des actifs fondée sur des preuves</title><desc id="desc">Chaque lien décrit des éléments enregistrés. La carte évolue lorsque l’utilisateur ajoute ou modifie des données et des vérifications. Aucune découverte automatique, analyse des appareils, détection de compromission en direct ou topologie réseau vérifiée n’est déduite.</desc>
