<text x="58" y="584" fill="#f0dca6" font-size="20">Aucune découverte automatique, analyse des appareils, détection de compromission en direct ou topologie réseau</text><text x="58" y="613" fill="#f0dca6" font-size="20">vérifiée n’est déduite.</text>
