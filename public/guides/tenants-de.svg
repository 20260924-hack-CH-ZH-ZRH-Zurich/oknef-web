<text x="382" y="282" fill="#f3fff8" font-size="20">Bewusste</text><text x="382" y="311" fill="#f3fff8" font-size="20">Bereichsauswahl</text>
<path d="M 620 288 H 658" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="666" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="688" y="240" font-size="18" fill="#79efb6">03</text>
<text x="688" y="282" fill="#f3fff8" font-size="20">Bestätigte</text><text x="688" y="311" fill="#f3fff8" font-size="20">Mitgliedschaft und</text><text x="688" y="340" fill="#f3fff8" font-size="20">Rolle</text>
<path d="M 926 288 H 964" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
