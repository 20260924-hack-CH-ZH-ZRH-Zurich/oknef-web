<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Persönliche, Familien- und Firmenbereiche</title><desc id="desc">Eine Einladung bindet die vorgesehene Konto-ID. Bestätige sie über einen vertrauenswürdigen Kanal. Ein Bereichswechsel erneuert den Sitzungskontext. Gemeinsame Metadaten sind serverseitig lesbar. Persönliche Einträge bleiben getrennt. Nur vorgesehene Tresor- und Dateiinhalte sind clientseitig verschlüsselt.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79efb6"/></marker></defs>
