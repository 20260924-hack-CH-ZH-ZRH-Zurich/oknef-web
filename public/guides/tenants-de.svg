<text x="54" y="120" fill="#f3fff8" font-size="32">Persönliche, Familien- und Firmenbereiche</text>
<rect x="54" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="76" y="240" font-size="18" fill="#79efb6">01</text>
<text x="76" y="282" fill="#f3fff8" font-size="20">Authentifiziertes</text><text x="76" y="311" fill="#f3fff8" font-size="20">Konto</text>
