<text x="994" y="282" fill="#f3fff8" font-size="20">Mandantenbezogene</text><text x="994" y="311" fill="#f3fff8" font-size="20">Daten und Ereignisse</text>
<text x="54" y="448" fill="#c9dcd5" font-size="22">Eine Einladung bindet die vorgesehene Konto-ID. Bestätige sie über einen vertrauenswürdigen Kanal.</text><text x="54" y="479" fill="#c9dcd5" font-size="22">Ein Bereichswechsel erneuert den Sitzungskontext.</text>
<rect x="38" y="550" width="1204" height="140" rx="18" fill="#2f3022"/>
<text x="58" y="584" fill="#f0dca6" font-size="20">Gemeinsame Metadaten sind serverseitig lesbar. Persönliche Einträge bleiben getrennt. Nur vorgesehene Tresor-</text><text x="58" y="613" fill="#f0dca6" font-size="20">und Dateiinhalte sind clientseitig verschlüsselt.</text>
