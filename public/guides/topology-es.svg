<title id="title">Mapa de activos basado en evidencias</title><desc id="desc">Cada conexión describe evidencia guardada. El mapa cambia al añadir o actualizar registros y comprobaciones. No se deducen descubrimiento automático, escaneo de dispositivos, compromiso en vivo ni topología de red verificada.</desc>
