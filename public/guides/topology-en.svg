<text x="994" y="282" fill="#f3fff8" font-size="20">Events and review</text><text x="994" y="311" fill="#f3fff8" font-size="20">history</text>
<text x="54" y="448" fill="#c9dcd5" font-size="22">Each connection describes saved evidence. The map changes when a user adds or updates records and</text><text x="54" y="479" fill="#c9dcd5" font-size="22">checks.</text>
