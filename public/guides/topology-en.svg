<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">An evidence-based map of assets</title><desc id="desc">Each connection describes saved evidence. The map changes when a user adds or updates records and checks. No automatic account discovery, device scanning, live compromise detection or verified network topology is inferred.</desc>
