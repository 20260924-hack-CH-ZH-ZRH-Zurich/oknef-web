<title id="title">Protección poscuántica local de archivos</title><desc id="desc">La clave privada queda bajo control del propietario. El descifrado es local. Compara las huellas por un canal de confianza. Contenedor experimental. Sin autenticación del remitente, auditoría independiente, protección del equipo comprometido ni carga automática.</desc>
