<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Espaces personnels, familiaux et professionnels</title><desc id="desc">L’invitation est liée à l’identifiant du compte prévu. Vérifiez-le par un canal de confiance. Un changement d’espace renouvelle le contexte de session. Les métadonnées partagées sont lisibles par le serveur. Les données personnelles restent séparées. Seuls les contenus désignés de coffre et de fichiers sont chiffrés côté client.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79efb6"/></marker></defs>
<rect width="1280" height="720" rx="24" fill="#071b15"/>
<g font-family="system-ui, sans-serif">
<text x="54" y="62" font-size="18" fill="#79efb6">OKNEF · 2026-09-25</text>
<text x="54" y="120" fill="#f3fff8" font-size="32">Espaces personnels, familiaux et professionnels</text>
<rect x="54" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="76" y="240" font-size="18" fill="#79efb6">01</text>
<text x="76" y="282" fill="#f3fff8" font-size="20">Compte authentifié</text>
