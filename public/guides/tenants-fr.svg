<rect x="360" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="382" y="240" font-size="18" fill="#79efb6">02</text>
<text x="382" y="282" fill="#f3fff8" font-size="20">Choix explicite de</text><text x="382" y="311" fill="#f3fff8" font-size="20">l’espace</text>
<path d="M 620 288 H 658" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="666" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="688" y="240" font-size="18" fill="#79efb6">03</text>
<text x="688" y="282" fill="#f3fff8" font-size="20">Adhésion acceptée et</text><text x="688" y="311" fill="#f3fff8" font-size="20">rôle</text>
<path d="M 926 288 H 964" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="972" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="994" y="240" font-size="18" fill="#79efb6">04</text>
<text x="994" y="282" fill="#f3fff8" font-size="20">Données et événements</text><text x="994" y="311" fill="#f3fff8" font-size="20">par locataire</text>
<text x="54" y="448" fill="#c9dcd5" font-size="22">L’invitation est liée à l’identifiant du compte prévu. Vérifiez-le par un canal de confiance. Un</text><text x="54" y="479" fill="#c9dcd5" font-size="22">changement d’espace renouvelle le contexte de session.</text>
<rect x="38" y="550" width="1204" height="140" rx="18" fill="#2f3022"/>
<text x="58" y="584" fill="#f0dca6" font-size="20">Les métadonnées partagées sont lisibles par le serveur. Les données personnelles restent séparées. Seuls les</text><text x="58" y="613" fill="#f0dca6" font-size="20">contenus désignés de coffre et de fichiers sont chiffrés côté client.</text>
</g></svg>
