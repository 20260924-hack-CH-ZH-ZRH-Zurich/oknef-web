<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Vom Plan zur erfassten menschlichen Entscheidung</title><desc id="desc">Antragsteller dürfen den eigenen Antrag nicht freigeben. Doppelte Stimmen zählen nicht mehrfach. Eine Ablehnung bleibt sichtbar. Erfasste Freigaben übertragen keine Anlagen und rekonstruieren keine Schlüssel. Tod und rechtliche Zuständigkeit sind nicht bestätigt. Automatische Freigabe ist gesperrt.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#79efb6"/></marker></defs>
<rect width="1280" height="720" rx="24" fill="#071b15"/>
<g font-family="system-ui, sans-serif">
<text x="54" y="62" font-size="18" fill="#79efb6">OKNEF · 2026-09-25</text>
<text x="54" y="120" fill="#f3fff8" font-size="32">Vom Plan zur erfassten menschlichen Entscheidung</text>
<rect x="54" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="76" y="240" font-size="18" fill="#79efb6">01</text>
<text x="76" y="282" fill="#f3fff8" font-size="20">Eigentümer definiert</text><text x="76" y="311" fill="#f3fff8" font-size="20">Richtlinie</text>
<path d="M 314 288 H 352" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="360" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="382" y="240" font-size="18" fill="#79efb6">02</text>
<text x="382" y="282" fill="#f3fff8" font-size="20">Benannte Mitglieder</text><text x="382" y="311" fill="#f3fff8" font-size="20">prüfen</text>
<path d="M 620 288 H 658" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="666" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="688" y="240" font-size="18" fill="#79efb6">03</text>
<text x="688" y="282" fill="#f3fff8" font-size="20">Verschiedene Stimmen</text><text x="688" y="311" fill="#f3fff8" font-size="20">bilden Quorum</text>
<path d="M 926 288 H 964" stroke="#79efb6" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="972" y="200" width="255" height="180" rx="18" fill="#143b2d" stroke="#39735b"/>
<text x="994" y="240" font-size="18" fill="#79efb6">04</text>
<text x="994" y="282" fill="#f3fff8" font-size="20">Prüfung durch</text><text x="994" y="311" fill="#f3fff8" font-size="20">Vollstrecker und</text><text x="994" y="340" fill="#f3fff8" font-size="20">Anbieter</text>
<text x="54" y="448" fill="#c9dcd5" font-size="22">Antragsteller dürfen den eigenen Antrag nicht freigeben. Doppelte Stimmen zählen nicht mehrfach.</text><text x="54" y="479" fill="#c9dcd5" font-size="22">Eine Ablehnung bleibt sichtbar.</text>
<rect x="38" y="550" width="1204" height="140" rx="18" fill="#2f3022"/>
<text x="58" y="584" fill="#f0dca6" font-size="20">Erfasste Freigaben übertragen keine Anlagen und rekonstruieren keine Schlüssel. Tod und rechtliche</text><text x="58" y="613" fill="#f0dca6" font-size="20">Zuständigkeit sind nicht bestätigt. Automatische Freigabe ist gesperrt.</text>
</g></svg>
